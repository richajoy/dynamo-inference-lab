# Equal-GPU baseline for P/D (2x H100): 2 aggregated Qwen3-8B workers, one whole GPU each, behind a
# KV router. Engine flags identical to deploy/agg-qwen3-8b.yaml. Compare against deploy/pd-qwen3-8b.yaml (1P + 1D on
# the same 2 GPUs): same GPUs, same model, only the serving topology differs.
# Apply: kubectl -n dynamo-system apply -f deploy/agg2-qwen3-8b.yaml
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agg2-qwen3-8b
  namespace: dynamo-system
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1
          command: ["python3"]
          args: ["-m", "dynamo.frontend", "--router-mode", "kv"]
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: VllmDecodeWorker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1
          workingDir: /workspace/examples/backends/vllm
          command: ["python3", "-m", "dynamo.vllm"]
          args:
          - --model
          - Qwen/Qwen3-8B
          - --gpu-memory-utilization
          - "0.90"
          - --max-model-len
          - "8192"
          - --max-num-seqs
          - "64"
          - --block-size
          - "16"
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
          envFrom:
          - secretRef:
              name: hf-token-secret
          env:
          - name: HF_HOME
            value: /models/hf
          volumeMounts:
          - name: hf-cache
            mountPath: /models/hf
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              ephemeral-storage: 4Gi
        volumes:
        # Node-local HF cache: weights download once, survive pod restarts/redeploys.
        # Must be pre-created owned by uid 1000 (image user `dynamo`) via `infra/k3s/install.sh dirs`:
        # fsGroup does NOT apply to hostPath, and DirectoryOrCreate would create it root-owned (755).
        - name: hf-cache
          hostPath:
            path: /var/lib/hf-cache
            type: Directory
