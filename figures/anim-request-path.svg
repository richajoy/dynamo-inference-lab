<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #1f2328; } .muted { fill: #57606a; } .boxink { fill: #1f2328; }
  .line { stroke: #8c959f; }
  .client { fill: #eef1f4; stroke: #57606a; }
  .dynamo { fill: #dbeafe; stroke: #1f6feb; }
  .gpu { fill: #e8f5d0; stroke: #4c8c00; }
  .kvbox { fill: #efe4ff; stroke: #8250df; }
  .prefill { fill: #fde7c9; stroke: #e07b00; }
  .decode { fill: #cfe8a9; stroke: #4c8c00; }
  .wait { fill: #ffd8d3; stroke: #cf222e; }
  .c-blue { fill: #1f6feb; } .c-green { fill: #4c8c00; } .c-orange { fill: #e07b00; }
  .c-purple { fill: #8250df; } .c-red { fill: #cf222e; }
  .s-purple { stroke: #8250df; } .s-red { stroke: #cf222e; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; }
  .label { font-size: 13px; } .small { font-size: 11.5px; } .bold { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #e6edf3; } .muted { fill: #9198a1; }
    .line { stroke: #6e7681; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion { display: none; }
  }

  @keyframes hl-agg-pre { 0.00% { opacity: 0; } 21.99% { opacity: 0; } 22.00% { opacity: 0.85; } 38.00% { opacity: 0.85; } 38.01% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes hl-agg-dec { 0.00% { opacity: 0; } 39.99% { opacity: 0; } 40.00% { opacity: 0.85; } 92.00% { opacity: 0.85; } 92.01% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes hl-dis-pre { 0.00% { opacity: 0; } 21.99% { opacity: 0; } 22.00% { opacity: 0.85; } 38.00% { opacity: 0.85; } 38.01% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes hl-dis-dec { 0.00% { opacity: 0; } 55.99% { opacity: 0; } 56.00% { opacity: 0.85; } 92.00% { opacity: 0.85; } 92.01% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes p-agg { 0.00% { opacity: 0; transform: translate(190px, 134px); } 1.99% { opacity: 0; transform: translate(190px, 134px); } 2.00% { opacity: 1; transform: translate(190px, 134px); } 6.83% { opacity: 1; transform: translate(300px, 134px); } 15.17% { opacity: 1; transform: translate(490px, 134px); } 20.00% { opacity: 1; transform: translate(600px, 134px); } 20.01% { opacity: 0; transform: translate(600px, 134px); } 100.00% { opacity: 0; transform: translate(600px, 134px); } }
  @keyframes p-dis { 0.00% { opacity: 0; transform: translate(190px, 352px); } 1.99% { opacity: 0; transform: translate(190px, 352px); } 2.00% { opacity: 1; transform: translate(190px, 352px); } 6.79% { opacity: 1; transform: translate(300px, 352px); } 15.08% { opacity: 1; transform: translate(490px, 346px); } 20.00% { opacity: 1; transform: translate(600px, 320px); } 20.01% { opacity: 0; transform: translate(600px, 320px); } 100.00% { opacity: 0; transform: translate(600px, 320px); } }
  @keyframes kv-dis { 0.00% { opacity: 0; transform: translate(750px, 350px); } 39.99% { opacity: 0; transform: translate(750px, 350px); } 40.00% { opacity: 1; transform: translate(750px, 350px); } 54.00% { opacity: 1; transform: translate(750px, 400px); } 54.01% { opacity: 0; transform: translate(750px, 400px); } 100.00% { opacity: 0; transform: translate(750px, 400px); } }
  @keyframes t-agg0 { 0.00% { opacity: 0; transform: translate(600px, 154px); } 41.99% { opacity: 0; transform: translate(600px, 154px); } 42.00% { opacity: 1; transform: translate(600px, 154px); } 44.41% { opacity: 1; transform: translate(490px, 154px); } 48.59% { opacity: 1; transform: translate(300px, 154px); } 51.00% { opacity: 1; transform: translate(190px, 154px); } 51.01% { opacity: 0; transform: translate(190px, 154px); } 100.00% { opacity: 0; transform: translate(190px, 154px); } }
  @keyframes t-dis0 { 0.00% { opacity: 0; transform: translate(600px, 430px); } 56.99% { opacity: 0; transform: translate(600px, 430px); } 57.00% { opacity: 1; transform: translate(600px, 430px); } 59.32% { opacity: 1; transform: translate(490px, 376px); } 62.92% { opacity: 1; transform: translate(300px, 374px); } 65.00% { opacity: 1; transform: translate(190px, 374px); } 65.01% { opacity: 0; transform: translate(190px, 374px); } 100.00% { opacity: 0; transform: translate(190px, 374px); } }
  @keyframes t-agg1 { 0.00% { opacity: 0; transform: translate(600px, 154px); } 51.99% { opacity: 0; transform: translate(600px, 154px); } 52.00% { opacity: 1; transform: translate(600px, 154px); } 54.41% { opacity: 1; transform: translate(490px, 154px); } 58.59% { opacity: 1; transform: translate(300px, 154px); } 61.00% { opacity: 1; transform: translate(190px, 154px); } 61.01% { opacity: 0; transform: translate(190px, 154px); } 100.00% { opacity: 0; transform: translate(190px, 154px); } }
  @keyframes t-dis1 { 0.00% { opacity: 0; transform: translate(600px, 430px); } 63.99% { opacity: 0; transform: translate(600px, 430px); } 64.00% { opacity: 1; transform: translate(600px, 430px); } 66.32% { opacity: 1; transform: translate(490px, 376px); } 69.92% { opacity: 1; transform: translate(300px, 374px); } 72.00% { opacity: 1; transform: translate(190px, 374px); } 72.01% { opacity: 0; transform: translate(190px, 374px); } 100.00% { opacity: 0; transform: translate(190px, 374px); } }
  @keyframes t-agg2 { 0.00% { opacity: 0; transform: translate(600px, 154px); } 61.99% { opacity: 0; transform: translate(600px, 154px); } 62.00% { opacity: 1; transform: translate(600px, 154px); } 64.41% { opacity: 1; transform: translate(490px, 154px); } 68.59% { opacity: 1; transform: translate(300px, 154px); } 71.00% { opacity: 1; transform: translate(190px, 154px); } 71.01% { opacity: 0; transform: translate(190px, 154px); } 100.00% { opacity: 0; transform: translate(190px, 154px); } }
  @keyframes t-dis2 { 0.00% { opacity: 0; transform: translate(600px, 430px); } 70.99% { opacity: 0; transform: translate(600px, 430px); } 71.00% { opacity: 1; transform: translate(600px, 430px); } 73.32% { opacity: 1; transform: translate(490px, 376px); } 76.92% { opacity: 1; transform: translate(300px, 374px); } 79.00% { opacity: 1; transform: translate(190px, 374px); } 79.01% { opacity: 0; transform: translate(190px, 374px); } 100.00% { opacity: 0; transform: translate(190px, 374px); } }
  @keyframes t-agg3 { 0.00% { opacity: 0; transform: translate(600px, 154px); } 71.99% { opacity: 0; transform: translate(600px, 154px); } 72.00% { opacity: 1; transform: translate(600px, 154px); } 74.41% { opacity: 1; transform: translate(490px, 154px); } 78.59% { opacity: 1; transform: translate(300px, 154px); } 81.00% { opacity: 1; transform: translate(190px, 154px); } 81.01% { opacity: 0; transform: translate(190px, 154px); } 100.00% { opacity: 0; transform: translate(190px, 154px); } }
  @keyframes t-dis3 { 0.00% { opacity: 0; transform: translate(600px, 430px); } 77.99% { opacity: 0; transform: translate(600px, 430px); } 78.00% { opacity: 1; transform: translate(600px, 430px); } 80.32% { opacity: 1; transform: translate(490px, 376px); } 83.92% { opacity: 1; transform: translate(300px, 374px); } 86.00% { opacity: 1; transform: translate(190px, 374px); } 86.01% { opacity: 0; transform: translate(190px, 374px); } 100.00% { opacity: 0; transform: translate(190px, 374px); } }
  @keyframes t-agg4 { 0.00% { opacity: 0; transform: translate(600px, 154px); } 81.99% { opacity: 0; transform: translate(600px, 154px); } 82.00% { opacity: 1; transform: translate(600px, 154px); } 84.41% { opacity: 1; transform: translate(490px, 154px); } 88.59% { opacity: 1; transform: translate(300px, 154px); } 91.00% { opacity: 1; transform: translate(190px, 154px); } 91.01% { opacity: 0; transform: translate(190px, 154px); } 100.00% { opacity: 0; transform: translate(190px, 154px); } }
  @keyframes t-dis4 { 0.00% { opacity: 0; transform: translate(600px, 430px); } 84.99% { opacity: 0; transform: translate(600px, 430px); } 85.00% { opacity: 1; transform: translate(600px, 430px); } 87.32% { opacity: 1; transform: translate(490px, 376px); } 90.92% { opacity: 1; transform: translate(300px, 374px); } 93.00% { opacity: 1; transform: translate(190px, 374px); } 93.01% { opacity: 0; transform: translate(190px, 374px); } 100.00% { opacity: 0; transform: translate(190px, 374px); } }</style>
<rect class="bg" x="0" y="0" width="960" height="520" rx="10"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text class="ink title" x="24" y="34">One request, two ways to serve it</text>
<text class="muted small" x="24" y="54">Blue: the prompt. Orange: prefill. Purple: the KV cache moving between GPUs. Green: output tokens.</text>
<text class="ink label bold" x="24" y="96">Aggregated: one GPU does prefill and decode</text>
<rect class="client" x="40" y="110" width="150" height="64" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="115.0" y="138.5" text-anchor="middle">Client</text>
<text class="boxink small" x="115.0" y="154.5" text-anchor="middle">(or AIPerf)</text>
<rect class="dynamo" x="300" y="110" width="190" height="64" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="395.0" y="138.5" text-anchor="middle">Dynamo frontend</text>
<text class="boxink small" x="395.0" y="154.5" text-anchor="middle">tokenize + route</text>
<rect class="gpu" x="600" y="110" width="300" height="64" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="750.0" y="138.5" text-anchor="middle">vLLM worker (one GPU)</text>
<text class="boxink small" x="750.0" y="154.5" text-anchor="middle">prefill, then one decode step per token</text>
<line class="line" x1="190" y1="134" x2="298" y2="134" stroke-width="1.6" marker-end="url(#head)"/>
<line class="line" x1="490" y1="134" x2="598" y2="134" stroke-width="1.6" marker-end="url(#head)"/>
<line class="line" x1="598" y1="154" x2="492" y2="154" stroke-width="1.6" marker-end="url(#head)"/>
<line class="line" x1="298" y1="154" x2="192" y2="154" stroke-width="1.6" marker-end="url(#head)"/>
<text class="ink label bold" x="24" y="268">Disaggregated: prefill and decode on separate GPUs</text>
<rect class="client" x="40" y="330" width="150" height="64" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="115.0" y="358.5" text-anchor="middle">Client</text>
<text class="boxink small" x="115.0" y="374.5" text-anchor="middle">(or AIPerf)</text>
<rect class="dynamo" x="300" y="330" width="190" height="64" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="395.0" y="358.5" text-anchor="middle">Dynamo frontend</text>
<text class="boxink small" x="395.0" y="374.5" text-anchor="middle">prefill leg, then decode leg</text>
<rect class="gpu" x="600" y="290" width="300" height="56" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="750.0" y="314.5" text-anchor="middle">Prefill worker (GPU 0)</text>
<text class="boxink small" x="750.0" y="330.5" text-anchor="middle">computes and stages the KV cache</text>
<rect class="gpu" x="600" y="402" width="300" height="56" rx="8" stroke-width="1.6"/>
<text class="boxink label bold" x="750.0" y="426.5" text-anchor="middle">Decode worker (GPU 1)</text>
<text class="boxink small" x="750.0" y="442.5" text-anchor="middle">pulls the KV, generates tokens</text>
<line class="line" x1="190" y1="352" x2="298" y2="352" stroke-width="1.6" marker-end="url(#head)"/>
<line class="line" x1="490" y1="346" x2="598" y2="320" stroke-width="1.6" marker-end="url(#head)"/>
<line class="s-purple" x1="750" y1="348" x2="750" y2="400" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#head)"/>
<text class="c-purple small bold" x="738" y="364" text-anchor="end">KV cache via NIXL / UCX</text>
<text class="muted small" x="738" y="378" text-anchor="end">NVLink, or TCP if the pods</text>
<text class="muted small" x="738" y="392" text-anchor="end">cannot see the peer GPU</text>
<line class="line" x1="598" y1="430" x2="492" y2="376" stroke-width="1.6" marker-end="url(#head)"/>
<line class="line" x1="298" y1="374" x2="192" y2="374" stroke-width="1.6" marker-end="url(#head)"/>
<rect class="prefill motion" x="600" y="110" width="300" height="64" rx="8" stroke-width="2.4" style="animation: hl-agg-pre 7s linear infinite; opacity: 0; fill: none; stroke-width: 5px;"/>
<rect class="decode motion" x="600" y="110" width="300" height="64" rx="8" stroke-width="2.4" style="animation: hl-agg-dec 7s linear infinite; opacity: 0; fill: none; stroke-width: 5px;"/>
<rect class="prefill motion" x="600" y="290" width="300" height="56" rx="8" stroke-width="2.4" style="animation: hl-dis-pre 7s linear infinite; opacity: 0; fill: none; stroke-width: 5px;"/>
<rect class="decode motion" x="600" y="402" width="300" height="56" rx="8" stroke-width="2.4" style="animation: hl-dis-dec 7s linear infinite; opacity: 0; fill: none; stroke-width: 5px;"/>
<circle class="c-blue motion" r="7" cx="0" cy="0" style="animation: p-agg 7s linear infinite; opacity: 0;"/>
<circle class="c-blue motion" r="7" cx="0" cy="0" style="animation: p-dis 7s linear infinite; opacity: 0;"/>
<circle class="c-purple motion" r="8" cx="0" cy="0" style="animation: kv-dis 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-agg0 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-dis0 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-agg1 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-dis1 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-agg2 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-dis2 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-agg3 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-dis3 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-agg4 7s linear infinite; opacity: 0;"/>
<circle class="c-green motion" r="6" cx="0" cy="0" style="animation: t-dis4 7s linear infinite; opacity: 0;"/>
<text class="muted small" x="24" y="500">Dynamo decides the order of the two legs and the workers; vLLM stages and pulls the KV blocks; UCX chooses the wire.</text>
</svg>
