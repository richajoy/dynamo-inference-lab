<text class="ink title" x="24" y="34">Why a KV transfer over NVLink slows down under load</text>
<text class="muted small" x="24" y="54">Measured on 2x H100: an idle 846 MiB transfer took 5.4 ms; under load a 6,000-token (843.75 MiB) transfer took ~93 ms.</text>
<text class="ink label bold" x="24" y="92">How the KV blocks are laid out decides the copy list</text>
<text class="ink small bold" x="24" y="116">Idle engine</text>
<text class="muted small" x="24" y="132">a new request gets adjacent free blocks</text>
