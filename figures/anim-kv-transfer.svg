  .s-purple { stroke: #8250df; } .s-red { stroke: #cf222e; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; }
  .label { font-size: 13px; } .small { font-size: 11.5px; } .bold { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #e6edf3; } .muted { fill: #9198a1; }
    .line { stroke: #6e7681; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion { display: none; }
  }

  @keyframes blk0 { 0.00% { opacity: 0.35; } 15.00% { opacity: 0.35; } 20.00% { opacity: 1; } 92.00% { opacity: 1; } 100.00% { opacity: 0.35; } }
