<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #1f2328; } .muted { fill: #57606a; } .boxink { fill: #1f2328; }
  .line { stroke: #8c959f; }
  .client { fill: #eef1f4; stroke: #57606a; }
  .dynamo { fill: #dbeafe; stroke: #1f6feb; }
  .gpu { fill: #e8f5d0; stroke: #4c8c00; }
  .kvbox { fill: #efe4ff; stroke: #8250df; }
  .prefill { fill: #fde7c9; stroke: #e07b00; }
  .decode { fill: #cfe8a9; stroke: #4c8c00; }
  .wait { fill: #ffd8d3; stroke: #cf222e; }
  .c-blue { fill: #1f6feb; } .c-green { fill: #4c8c00; } .c-orange { fill: #e07b00; }
  .c-purple { fill: #8250df; } .c-red { fill: #cf222e; }
  .s-purple { stroke: #8250df; } .s-red { stroke: #cf222e; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; }
  .label { font-size: 13px; } .small { font-size: 11.5px; } .bold { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #e6edf3; } .muted { fill: #9198a1; }
    .line { stroke: #6e7681; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion { display: none; }
  }

  @keyframes bar0 { 0.00% { transform: scaleX(0); } 0.40% { transform: scaleX(1); } 96.00% { transform: scaleX(1); } 100.00% { transform: scaleX(0); } }
  @keyframes bar1 { 0.00% { transform: scaleX(0); } 80.00% { transform: scaleX(1); } 96.00% { transform: scaleX(1); } 100.00% { transform: scaleX(0); } }
  @keyframes blk0 { 0.00% { opacity: 0.35; } 15.00% { opacity: 0.35; } 20.00% { opacity: 1; } 92.00% { opacity: 1; } 100.00% { opacity: 0.35; } }
  @keyframes blk1 { 0.00% { opacity: 0.35; } 50.00% { opacity: 0.35; } 55.00% { opacity: 1; } 92.00% { opacity: 1; } 100.00% { opacity: 0.35; } }</style>
<rect class="bg" x="0" y="0" width="960" height="500" rx="10"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text class="ink title" x="24" y="34">Moving one KV cache (846 MiB) from the prefill GPU to the decode GPU</text>
<text class="muted small" x="24" y="54">Both bars run on the same clock. Measured on 2x H100: the link UCX chooses decides everything.</text>
<text class="ink label bold" x="24" y="114">CUDA IPC over NVLink</text>
<text class="muted small" x="24" y="130">both GPUs visible to the pods</text>
<rect class="client" x="260" y="96" width="600" height="30" rx="5" stroke-width="1"/>
<rect class="c-green" x="260" y="96" width="600" height="30" rx="5" style="transform-origin: 260px 96px; animation: bar0 6s linear infinite;"/>
<text class="ink label bold" x="874" y="116">5.4 ms</text>
<text class="ink label bold" x="24" y="184">TCP over the pod network</text>
<text class="muted small" x="24" y="200">one GPU per pod (the default)</text>
<rect class="client" x="260" y="166" width="600" height="30" rx="5" stroke-width="1"/>
<rect class="c-red" x="260" y="166" width="600" height="30" rx="5" style="transform-origin: 260px 166px; animation: bar1 6s linear infinite;"/>
<text class="ink label bold" x="874" y="186">~2,000 ms</text>
<text class="c-purple label bold" x="260" y="246">About 370x apart. Over TCP a prompt-heavy service topped out near 1 request/s.</text>
<text class="ink label bold" x="24" y="292">Once the link is fast: how the KV blocks are laid out decides the copy list</text>
<text class="ink small bold" x="24" y="316">Idle engine</text>
<text class="muted small" x="24" y="332">a new request gets adjacent free blocks</text>
